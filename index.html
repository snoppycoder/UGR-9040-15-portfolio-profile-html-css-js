<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milki's Portfolio</title>
    <link rel="icon" href="Images/portfolio.png" type="image/png">
    <style>
        /* Reset & Base Styles */
        :root {
            --color-primary: #FFD700;
            --color-secondary: #B8860B;
            --color-background: #1A1A1A;
            --color-text: #FFFFFF;
            --spacing-large: 2rem;
            --spacing-medium: 1.5rem;
            --spacing-small: 0.75rem;
            --container-width: min(90%, 1200px);
        
}


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--color-background);
            color: var(--color-text);
            line-height: 1.6;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar{
            display: none;
        }

        .nav {
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            padding: var(--spacing-small);
            background-color: rgba(26, 26, 26, 0.95);
            animation: SlideLeft 0.5s ease-out;
        }
        

        .nav__list {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            list-style: none;
            padding: var(--spacing-small) var(--spacing-medium);
        }

        .nav__item {
            position: relative;
        }

        .nav__link {
            color: var(--color-text);
            text-decoration: none;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: color 0.3s ease;
        }

        .nav__link:hover {
            color: var(--color-primary);
        }

        .nav__link--active {
            position: relative;
        }

        .nav__link--active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--color-primary);
            animation: slideIn 0.3s ease-out;
        }

      
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-large) var(--spacing-medium);
            text-align: center;
        }

        .hero__icon {
            font-size: 5rem;
            margin-bottom: var(--spacing-medium);
            animation: fadeInDown 1s ease-out;
        }

        .hero__title {
            font-size: 3.5rem;
            margin-bottom: var(--spacing-small);
            animation: fadeInUp 1s ease-out;
        }

        .hero__subtitle {
            font-size: 2.5rem;
            margin-bottom: var(--spacing-medium);
            animation: fadeInUp 1.2s ease-out;
        }

        .hero__highlight {
            color: var(--color-primary);
        }

        .hero__buttons {
            display: flex;
            gap: var(--spacing-medium);
            animation: fadeInUp 1.4s ease-out;
        }

        .button {
            padding: var(--spacing-small) 1rem;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button--primary {
            background-color: var(--color-primary);
            color: var(--color-background);
        }

        .button--secondary {
            background-color: var(--color-secondary);
            color: var(--color-text);
        }

      

            .footer {
        padding: var(--spacing-medium);
        position: relative; 
        width: 100%;
        text-align: center;
        background-color: #0000;
        margin-top: auto; 
        animation: fadeInUp 1.6s ease-out;
    }

        .footer__list {
            display: flex;
            justify-content: center;
            gap: var(--spacing-medium);
            list-style: none;
            margin-top: 1rem;
        }

        .footer__item {
            display: inline-block;
        }
       

        .footer__link {
            color: var(--color-text);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer__link:hover {
            color: var(--color-primary);
        }

        .footer__icon {
            width: 40px;
            height: 40px;
            transition: transform 0.3s ease;
        }

        .footer__icon:hover {
            transform: translateY(-3px);
        }
                /* Hamburger Menu */
        .nav__hamburger {
            display: none;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            padding: 10px;
        }

        .nav__hamburger-line {
            width: 30px;
            height: 3px;
            background-color: var(--color-text);
            transition: 0.3s ease;
        }
                .nav__hamburger--active .nav__hamburger-line:nth-child(1) {
            transform: rotate(45deg) translateY(12px) translateX(2px)
        }

        .nav__hamburger--active .nav__hamburger-line:nth-child(2) {
            opacity: 0;
        }

        .nav__hamburger--active .nav__hamburger-line:nth-child(3) {
            transform: rotate(-45deg) translateY(-10px)
        }

        /* Animations */
        @keyframes SlideLeft {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav__hamburger {
                display: flex;
            }

            .nav__list {
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            right: 0;
            height: 50%;
            width: 40%;
            background-color: rgba(26, 26, 26, 0.95);
            padding: var(--spacing-medium);
            transform: translateX(100%); /* Start off-screen */
            transition: transform 0.3s ease-in-out; /* Smooth transition */
}

.nav__list--active {
    transform: translateX(0); /* Slide into view */
}


            .hero__title {
                font-size: 2.5rem;
            }

            .hero__subtitle {
                font-size: 1.8rem;
            }

    
            .footer__list {
                gap: var(--spacing-medium);
            }
        }

        @media (max-width: 480px) {
            .hero__title {
                font-size: 2rem;
            }
            img {
            max-width: 100%;
        }

            .hero__subtitle {
                font-size: 1.5rem;
            }
            .hero__buttons{
                margin-top: var(--spacing-large);
            }

            .button {
                width: auto;
                text-align: center;
            } 
            .footer__item {
                gap: var(--spacing-large);
            }
            
        }
    </style>
</head>
<body>
    <header class="nav">
        <div class="nav__hamburger" onclick="toggleMenu()">
            <span class="nav__hamburger-line"></span>
            <span class="nav__hamburger-line"></span>
            <span class="nav__hamburger-line"></span>
        </div>
        <nav aria-label="Main Navigation">
            <ul class="nav__list" role="menubar">
                <li class="nav__item" role="none">
                    <a href="home.html" class="nav__link nav__link--active" role="menuitem">Home</a>
                </li>
                <li class="nav__item" role="none">
                    <a href="about.html" class="nav__link" role="menuitem">About</a>
                </li>
                <li class="nav__item" role="none">
                    <a href="blog.html" class="nav__link" role="menuitem">Blog</a>
                </li>
                <li class="nav__item" role="none">
                    <a href="service.html" class="nav__link" role="menuitem">Service</a>
                </li>
                <li class="nav__item" role="none">
                    <a href="contact.html" class="nav__link" role="menuitem">Contact</a>
                </li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero__icon">
                <img src = "Images/hero_section.png"/>
            </div>
            <h1 class="hero__title" id="hero-title">Hi, I'm Milki</h1>
            <h2 class="hero__subtitle">
                <span class="hero__highlight">A Software Engineer</span> &
                <br>A UI/UX Designer
            </h2>
            <div class="hero__buttons" role="group" aria-label="Call to action buttons">
                <a href="about.html#prompt_to_download" class="button button--primary">Download Resume</a>
                <a href="contact.html" class="button button--secondary">Contact Me</a>
            </div>
        </section>
    </main>

    <footer class="footer">
        <ul class="footer__list" aria-label="Social Media Links">
            <li class="footer__item">
                <a href="https://github.com/snoppycoder/" target="_blank" rel="noopener noreferrer" 
                   aria-label="GitHub Profile" class="footer__link">
                 <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcThdZlszhihSfJBfoXkpJtOvDk9p_sskS4rSQ&s" class="footer__icon" alt="github link">
                </a>
            </li>
            <li class="footer__item">
                <a href="https://www.linkedin.com/in/milki-legesse-66607a312/" target="_blank" 
                   rel="noopener noreferrer" aria-label="LinkedIn Profile" class="footer__link">
                    <img src="https://i.pinimg.com/564x/6b/ab/30/6bab3017350ca04c6fa05569672bd31e.jpg" class="footer__icon" alt="LinkedIn">
                </a>
            </li>
            <li class="footer__item">
                <a href="mailto:example@email.com" target="_blank" rel="noopener noreferrer" 
                   aria-label="Email Contact" class="footer__link">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRKtMxPYeDrZNx4OsXl26sJgg1xcpeOKzoE3Q&s" class="footer__icon" alt="Email">
                </a>
            </li>
        </ul>
    </footer>

    <script defer>
        function toggleMenu() {
            const hamburger = document.querySelector('.nav__hamburger');
            const navList = document.querySelector('.nav__list');
            hamburger.classList.toggle('nav__hamburger--active');
            navList.classList.toggle('nav__list--active');
        }
    </script>
</body>
</html>
